<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vayun.xyz Workstation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 340px;
      background-color: #0b0c10;
      color: #f1f1f1;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f232b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .brand-tag {
      font-size: 10px;
      color: #10b981;
      font-family: monospace;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
      font-family: monospace;
      margin-bottom: 8px;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tool-btn {
      background: #16181d;
      border: 1px solid #252830;
      color: #e6edf3;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .tool-btn:hover {
      background: #1f232b;
      border-color: #383d47;
      transform: translateY(-1px);
    }
    .tool-btn .name {
      font-weight: 600;
    }
    .tool-btn .desc {
      font-size: 9px;
      color: #8b949e;
    }
    .quick-counter {
      background: #14161b;
      border: 1px solid #23262e;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .quick-counter textarea {
      width: 100%;
      height: 48px;
      background: #090a0d;
      border: 1px solid #2b2f38;
      border-radius: 6px;
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      resize: none;
      outline: none;
    }
    .quick-counter textarea:focus {
      border-color: #3b82f6;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 10px;
      font-family: monospace;
      color: #8b949e;
    }
    .stats-row strong {
      color: #10b981;
    }
    .footer-btn {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
      text-decoration: none;
    }
    .footer-btn:hover {
      background: #e5e5e5;
    }
    .privacy-notice {
      text-align: center;
      font-size: 9px;
      color: #6e7681;
      font-family: monospace;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon48.png" alt="Vayun Logo">
      <div>
        <div class="brand-title">vayun.xyz</div>
      </div>
    </div>
    <div class="brand-tag">RAM ONLY</div>
  </div>

  <div class="section-title">Developer & PDF Tools</div>
  <div class="tools-grid">
    <a href="https://vayun.xyz/#/flow" target="_blank" class="tool-btn" id="btn-flow">
      <span class="name">Vayun Flow</span>
      <span class="desc">Trace multi-file logic</span>
    </a>
    <a href="https://vayun.xyz/#/viva" target="_blank" class="tool-btn" id="btn-viva">
      <span class="name">Viva Defense</span>
      <span class="desc">Socratic code exam</span>
    </a>
    <a href="https://vayun.xyz/#/split-pdf" target="_blank" class="tool-btn" id="btn-split">
      <span class="name">Split PDF</span>
      <span class="desc">High-capacity ranges</span>
    </a>
    <a href="https://vayun.xyz/#/merge-pdf" target="_blank" class="tool-btn" id="btn-merge">
      <span class="name">Merge PDF</span>
      <span class="desc">Combine in browser</span>
    </a>
  </div>

  <div class="section-title">Instant Token Counter</div>
  <div class="quick-counter">
    <textarea id="token-input" placeholder="Paste prompt or text to count tokens..."></textarea>
    <div class="stats-row">
      <span>Tokens: <strong id="token-count">0</strong></span>
      <span>Chars: <strong id="char-count">0</strong></span>
      <span>Words: <strong id="word-count">0</strong></span>
    </div>
  </div>

  <a href="https://vayun.xyz" target="_blank" class="footer-btn" id="btn-open-full">
    <span>Open Full Vayun Workstation &rarr;</span>
  </a>

  <div class="privacy-notice">
    Zero remote uploads • 100% Client-side execution
  </div>

  <script src="popup.js"></script>
</body>
</html>
